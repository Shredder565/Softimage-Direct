name: Build AfterImage Windows installer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'electron/**'
      - 'electron-builder.yml'
      - 'build/icon.*'
      - '.github/workflows/build-windows.yml'
      - 'src/**'
      - 'index.html'
      - 'vite.config.ts'
  push:
    branches: [main]
    tags:
      - 'v*'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-win:
    name: AfterImage Windows NSIS
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Vite app + NSIS installer
        run: npm run build:win
        env:
          # Skip code signing in CI unless secrets are configured.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          # Keep artifact names slash-free (PR refs look like "42/merge").
          name: AfterImage-windows-setup
          path: release/AfterImage-*-setup.exe
          if-no-files-found: error

      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: release/AfterImage-*-setup.exe
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
